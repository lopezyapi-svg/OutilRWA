# Description du service pour Render.
# Render lit ce fichier et cree le service automatiquement (« Blueprint »).
#
# ATTENTION : le service actuellement en ligne s'appelle « outil-rwa »
# (https://outil-rwa.onrender.com) et a ete cree A LA MAIN, pas depuis ce
# blueprint. Il n'est donc PAS resynchronise par ce fichier : toute variable
# d'environnement ajoutee/modifiee ici doit aussi etre reportee manuellement
# dans le dashboard Render (service outil-rwa -> Environment). Ce fichier
# reste la reference pour recreer le service proprement via New -> Blueprint.

services:
  - type: web
    name: risque-management
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /sante

    envVars:
      # Authentification desactivee (demande explicite) : le service reste
      # public, sans ecran de connexion.
      - key: RWA_AUTH_ENABLED
        value: "0"

      # Demo publique : sans portefeuille importe ni courbe actualisee, la
      # section Value at Risk retombe sur une serie SIMULEE reproductible
      # (badge « Donnees simulees » cote interface). Des qu'un portefeuille
      # reel est importe ou la courbe UEMOA actualisee, ces donnees priment
      # et la simulation n'est plus utilisee. A retirer pour une instance de
      # production alimentee par des donnees reelles.
      #
      # Deja pose manuellement le 2026-09-10 dans le dashboard du service
      # outil-rwa (Environment -> VAR_MODE_SIMULATION = 1), verifie en ligne
      # (les 3 methodes VaR calculent, badge « Donnees simulees » affiche).
      # Conserve ici pour qu'une recreation via blueprint le reprenne.
      - key: VAR_MODE_SIMULATION
        value: "1"

      # Secret de signature genere par Render, jamais ecrit dans le depot.
      # Le regenerer deconnecte tout le monde.
      - key: RWA_JWT_SECRET
        generateValue: true

      # L'application et l'API partagent l'adresse : le cookie porte donc le
      # chemin vu par le navigateur.
      - key: RWA_REFRESH_COOKIE_PATH
        value: /api/auth
      - key: RWA_REFRESH_COOKIE_SECURE
        value: "1"
      - key: RWA_ACCESS_TOKEN_MINUTES
        value: "60"
      - key: RWA_REFRESH_TOKEN_HOURS
        value: "12"

      # Comptes crees au premier demarrage (aucune console sur l'offre
      # gratuite). Les mots de passe se saisissent dans l'interface de Render,
      # jamais ici : « sync: false » demande la valeur au moment du deploiement.
      # Un compte deja existant n'est jamais modifie par ces variables.
      - key: RWA_COMPTE_CONSULTATION
        value: superieur
      - key: RWA_COMPTE_CONSULTATION_MDP
        sync: false
      - key: RWA_COMPTE_EDITION
        value: pascal
      - key: RWA_COMPTE_EDITION_MDP
        sync: false
      - key: RWA_COMPTE_ADMINISTRATOR
        value: administrator
      - key: RWA_COMPTE_ADMINISTRATOR_MDP
        sync: false
      - key: RWA_COMPTE_LOPEZ
        value: lopez
      - key: RWA_COMPTE_LOPEZ_MDP
        sync: false
